[package]
name = "local-ai-companion-tauri"
version = "0.2.0"
description = "Desktop avatar shell for Local AI Companion"
authors = ["Khalil"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
anyhow = "1.0.95"
futures-util = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2.1"
tauri-plugin-global-shortcut = "2.2.1"
tauri-plugin-shell = "2.3.1"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = "0.24.0"
window-vibrancy = "0.7.1"
