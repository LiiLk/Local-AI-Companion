# Local AI Companion
# Tracked config = simple defaults.
# Put secrets and machine-specific overrides in config/config.local.yaml.

mode: "pipeline"  # "pipeline", "omni", "gemma-omni"

server:
  # Local-first default. Use config.local.yaml or --host 0.0.0.0 only when
  # intentionally exposing the companion on your LAN.
  host: "127.0.0.1"
  port: 8000
  cors:
    # null derives http://127.0.0.1:<port> and http://localhost:<port>.
    # Set an explicit list in config.local.yaml for custom frontend origins.
    allow_origins: null
    allow_credentials: false

pipeline:
  vad_required_misses: 20
  reply_language: "en"
  # Generic spoken-style guidance appended to the character system prompt when
  # the reply is synthesized as voice. Set to "" to disable it entirely.
  voice_style_prompt: |
    You are speaking out loud in a real-time voice conversation.
    Reply in natural spoken language, using 1 to 3 sentences by default.
    If the user explicitly asks for a detailed explanation, use at most 5 to 6
    sentences, then offer to continue.
    Never use Markdown, lists, headings or emojis, and do not put
    abbreviations in parentheses. Write numbers and symbols the way they are
    pronounced. Emotion markers requested by your character instructions are
    still allowed.
  # Interpretation hint injected per spoken turn in pipeline mode only: it
  # tells the LLM that the user's speech turns are automatic transcriptions and
  # may contain recognition errors. Never applied to messages the user types.
  # Set to "" to disable it. Not used in omni modes.
  transcription_hint_prompt: |
    The user's messages are automatic speech transcriptions and may contain
    recognition errors, especially acronyms, numbers, years and proper names
    (for example 'GI' for 'AGI', 'W27' for '2027'). Interpret them charitably
    from context and answer the most likely intended question. Only ask for
    clarification if the meaning is truly ambiguous.

memory:
  enabled: true
  history_path: "data/memory/conversation.jsonl"
  summary_path: "data/memory/summary.txt"
  max_recent_turns: 8
  max_message_chars: 2000
  max_summary_chars: 2000
  curate_enabled: true
  curator_timeout_sec: 20
  curator_max_input_chars: 1200
  curator_max_output_chars: 3000

audio:
  # Desktop backend behavior:
  # - bridge-only defaults to muted unless explicitly overridden here.
  # - allow_barge_in=false prevents the assistant's own playback from
  #   re-triggering VAD/ASR through speaker leakage.
  start_muted: false
  bridge_start_muted: true
  allow_barge_in: false
  # Extra grace period after a VAD segment ends before we commit the user turn.
  # This lets short pauses stay in the same utterance instead of triggering an
  # immediate response.
  # Used as the fallback delay when semantic turn detection is disabled or
  # unavailable.
  speech_commit_delay_ms: 700
  # Semantic end-of-turn detection (Smart Turn v3.2, CPU int8).
  # When enabled, a short pause commits quickly if the model judges the turn
  # complete, and waits longer when the speaker is likely still thinking.
  # Set enabled: false for the previous strictly fixed-delay behavior.
  turn_detection:
    enabled: true
    model: "smart-turn-v3.2-cpu"
    threshold: 0.5
    # Three-tier commit policy: p >= threshold commits fast, threshold > p >=
    # uncertain_threshold is a hedged wait (hesitation), below that the speaker
    # is treated as mid-sentence and the long wait applies.
    uncertain_threshold: 0.15
    complete_delay_ms: 250
    uncertain_delay_ms: 900
    incomplete_delay_ms: 2500
    # Shorter VAD end-of-speech silence threshold used only while Smart Turn is
    # enabled and available (8 frames * 32 ms = ~256 ms) instead of the global
    # vad_required_misses below.
    vad_required_misses: 8
    # Optional tuning aid: save every evaluated turn as 16 kHz mono WAV
    # (timestamped, tagged with the tier and probability). null = disabled,
    # nothing is written by default.
    debug_save_dir: null
  vad_prob_threshold: 0.58
  vad_db_threshold: -47
  vad_required_hits: 4
  vad_required_misses: 20
  vad_min_speech_ms: 450
  vad_min_voiced_ms: 180

llm:
  # Stable choices for the normal pipeline:
  # - "ollama"     : local LLM
  # - "openrouter" : cloud LLM
  # - "gemma"      : advanced local multimodal path
  provider: "ollama"

  ollama:
    model: "qwen3.5:4b"
    base_url: "http://localhost:11434"
    think: false
    # Avoid a cold model reload after Ollama's default 5-minute idle timeout.
    keep_alive: "30m"
    request_timeout_sec: 180
    preload_timeout_sec: 120
    turn_timeout_sec: 210
    options:
      # Keep enough VRAM available for Whisper + Kokoro on a 12 GB GPU.
      # Ollama may otherwise inherit a host-wide 65k context and reserve
      # several extra gigabytes even though companion prompts are bounded.
      num_ctx: 4096
      temperature: 0.6
      top_p: 0.9
      top_k: 40
      presence_penalty: 0.1

  openrouter:
    model: "deepseek/deepseek-v4-flash"
    api_key: null  # keep null here; use env or config.local.yaml
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    app_url: null
    app_title: "Local-AI-Companion"
    required_input_modalities: []
    request_timeout_sec: 180
    preload_timeout_sec: 60
    options:
      temperature: 0.6
      top_p: 0.9
      max_completion_tokens: 512
      reasoning:
        effort: "high"

  # Adaptive reasoning ("fast by default, think when needed").
  # The first call always runs with base_effort (which replaces
  # llm.openrouter.options.reasoning.effort for that call). A short routing
  # instruction lets the model ask for a deeper pass by replying with a marker
  # only; when it does, the pipeline speaks a filler phrase and re-runs the same
  # conversation with the escalated effort and a larger token budget.
  # enabled: false restores the previous single-call behavior exactly.
  adaptive_reasoning:
    enabled: true
    base_effort: "none"
    escalate_effort: "medium"
    max_effort: "high"
    escalated_max_completion_tokens: 2048
    # Waiting phrases can be a plain list (used for every language) or a
    # mapping keyed by short language code, with "default"/"en" fallbacks.
    filler_phrases:
      en:
        - "Hmm, let me think about that."
        - "Good question, give me a second."
        - "Okay, let me work that out."
      fr:
        - "Hmm, laisse-moi réfléchir."
        - "Bonne question, une seconde."
        - "D'accord, je regarde ça."
    routing_prompt: |
      Routing instruction: before answering, decide whether the user's request
      genuinely requires careful multi-step reasoning, a non-trivial calculation,
      planning, or writing code. If it does, reply with exactly <|THINK|> and
      nothing else, or <|THINK_HARD|> if it is especially difficult. Otherwise,
      answer the user normally. Never output these markers unless you are asking
      for deeper reasoning.

character:
  preset: "march7th"

tts:
  # Stable choices:
  # - "kokoro" : best local realtime path, especially with RVC enabled
  # - "qwen3"  : best local premium voice path
  # - "chatterbox" / "edge" : optional fallbacks
  provider: "kokoro"
  stream_tts: true
  # Max queued sentences waiting for TTS. Keeps long LLM streams memory-bounded.
  # Set to 0 only for the legacy unbounded queue behavior.
  max_queue_size: 8
  warmup_on_start: true
  auto_detect_language: true
  kokoro_voice: "ff_siwis"
  voice: "en-US-JennyNeural"
  rate: "+0%"
  pitch: "+0Hz"

  qwen3:
    model_id: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    mode: "voice_clone"
    language: "auto"
    speaker: null
    instruct: ""
    ref_audio_path: "resources/voices/march7th/VO_Archive_March_7th_5.wav"
    ref_text: null
    x_vector_only_mode: true
    device: "cuda:0"
    dtype: "bfloat16"
    attn_implementation: "sdpa"
    backend: "worker"
    # Dedicated provider environment. On WSL/Linux, the resolver maps
    # Scripts/python.exe to bin/python without falling back to the main venv.
    python_path: ".venv-qwen3-tts/Scripts/python.exe"
    site_packages_dir: null
    worker_script: "scripts/qwen3_tts_worker.py"
    request_timeout_sec: 20

  routed:
    preload_fallbacks: true
    warmup_fallbacks: true
    provider_order_by_language:
      fr: ["chatterbox", "qwen3", "kokoro"]
      en: ["qwen3", "chatterbox", "kokoro"]

  chatterbox:
    model_id: "onnx-community/chatterbox-multilingual-ONNX"
    cfg_weight: 0.5
    prefer_full_gpu: true

  rvc:
    enabled: true
    backend: "worker"
    # The stable RVC overlay shares the main runtime interpreter. This Windows
    # venv path is mapped to venv/bin/python under WSL/Linux.
    python_path: "venv/Scripts/python.exe"
    site_packages_dir: ".rvc-overlay"
    worker_script: "scripts/rvc_worker.py"
    model_path: "resources/voices/march7th/March-7th.pth"
    index_path: "resources/voices/march7th/March-7th.index"
    # Optional SHA-256 pins for downloaded voice artifacts. RVC .pth files are
    # PyTorch checkpoints, so only use models from trusted sources and pin hashes
    # for public/distributed voice packs when possible.
    model_sha256: null
    index_sha256: null
    device: "cuda:0"
    f0_method: "rmvpe"
    f0_up_key: 0.0
    index_rate: 0.0
    protect: 0.33
    output_freq: null

asr:
  # Provider choices:
  # - "whisper"  : public multilingual default
  # - "parakeet" : optional local candidate; install requirements-optional-parakeet.txt
  # - "qwen3"    : advanced local quality path
  provider: "whisper"
  # Whisper profile. Public default "balanced" for broad GPU compatibility:
  #   balanced      -> whisper small,          beam 3  (~2GB VRAM)
  #   quality-local -> whisper large-v3-turbo, beam 5  (~6GB VRAM, much better FR/EN)
  # Switch in config/config.local.yaml: `asr.profile: "quality-local"`.
  # Tight VRAM on quality-local? also set `asr.compute_type: "int8_float16"`.
  # Power users can still override asr.model_size / asr.beam_size directly.
  profile: "balanced"
  language: "auto"
  # Optional transcription bias passed to Whisper as initial_prompt. Whisper
  # imitates the STYLE of this text, so keep it as natural transcription prose
  # rather than a bare keyword list; it noticeably improves acronyms, years and
  # proper nouns (e.g. AGI, 2027, Nvidia). Add your own names/jargon here. It is
  # ignored by providers that do not support an initial prompt. Set to "" to
  # disable.
  prompt: "Discussion sur l'IA, l'AGI, les LLM, le CPU, le GPU et la VRAM, l'API, le RVC et le TTS, Python, C++, Linux, Windows et GitHub, Nvidia, OpenAI, Anthropic et DeepSeek, en 2026, 2027 et 2030."
  # Minimum committed audio length before ASR runs (16 kHz mono PCM16).
  # Shorter turns are ignored before the model runs, so no LLM response is
  # produced. Distinct from vad_min_speech_ms, which tunes VAD segmentation.
  min_audio_ms: 700
  compute_type: "float16"
  device: "cuda"

  # Used only when provider is "parakeet". Keep model/runtime choices
  # configurable because Parakeet is an optional experimental path.
  parakeet:
    model_name: "nemo-parakeet-tdt-0.6b-v3"
    quantization: "int8"
    # providers: ["CUDAExecutionProvider"]

  qwen3:
    model_id: "Qwen/Qwen3-ASR-0.6B"
    device: "cuda:0"
    dtype: "bfloat16"
    max_new_tokens: 256
    backend: "worker"
    python_path: ".venv-qwen3-asr-worker/Scripts/python.exe"
    site_packages_dir: null
    worker_script: "scripts/qwen3_asr_worker.py"

# Advanced local multimodal paths.
# Leave these alone unless you explicitly switch mode or llm.provider.
omni:
  provider: "minicpmo"
  minicpmo:
    model_id: "openbmb/MiniCPM-o-4_5"
    quantization: "int4"
    device: "cuda"
    dtype: "bfloat16"
    attn_implementation: "sdpa"
    init_vision: false
    init_audio: true
    init_tts: true
    use_single_pass: true
    transcribe_for_history: false
    generate_audio: true
    stream_tts: false
    max_tokens: 512
    temperature: 0.7
    ref_audio_path: null
    speech_languages: ["en", "zh"]

gemma:
  model_id: "google/gemma-4-E2B-it"
  quantization: "int4"
  device: "cuda"
  cpu_offload: true
  offload_dir: ".cache/hf-offload/gemma"
  dtype: "bfloat16"
  max_new_tokens: 64
  turn_timeout_sec: 75
  temperature: 0.3
  top_p: 0.9
  context_max_turns: 6
  vision:
    enabled: true
    token_budget: 140
    detail_token_budget: 1120
  vad_required_misses: 10
  screen:
    enabled: false
    interval: 2.0
    max_buffer: 30
    change_threshold: 0.05
    include_in_conversation: false
